# ~/.config/hypr/hyprlock.conf

$font = JetBrainsMono Nerd Font   # change to whatever font you like

general {
    hide_cursor = true
    ignore_empty_input = true
    # grace = 2                   # optional: 2 second grace period
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 3, linear
    animation = fadeOut, 1, 3, linear
    animation = inputFieldDots, 1, 2, linear
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 7
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
}

# Password input
input-field {
    monitor =
    size = 280, 50
    outline_thickness = 2
    dots_size = 0.3
    dots_spacing = 0.25
    dots_center = true
    outer_color = rgba(8ec07cee) rgba(fabd2fee) 45deg
    inner_color = rgba(0, 0, 0, 0.4)
    font_color = rgba(235, 219, 178, 1.0)
    fade_on_empty = true
    rounding = 12
    check_color = rgba(fabd2fee)
    fail_color = rgba(fb4934ee)
    placeholder_text = <i>Password...</i>
    fail_text = <i>$FAIL</i>
    font_family = $font
    position = 0, -40
    halign = center
    valign = center
}

# Time
label {
    monitor =
    text = $TIME
    font_size = 90
    font_family = $font
    color = rgba(235, 219, 178, 1.0)
    position = 0, 120
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    font_size = 22
    font_family = $font
    color = rgba(168, 153, 132, 1.0)
    position = 0, 40
    halign = center
    valign = center
}

# User
label {
    monitor =
    text = $USER
    font_size = 16
    font_family = $font
    color = rgba(168, 153, 132, 0.8)
    position = 0, -100
    halign = center
    valign = center
}
